    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {

        color: var(--text-main);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100dvh;
        overflow-x: hidden;
        position: relative;
    }

    .bg-video {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        object-fit: cover; z-index: -2; pointer-events: none;
    }
    .bg-overlay {

        background: rgba(0, 0, 0, 0.35); z-index: -1;
    }

    .app-container {
        position: relative;

        height: 100dvh;

        flex-direction: column;
        z-index: 10;

    .view { display: none; flex-direction: column; height: 100%; }

    #loginView { justify-content: space-between; padding: 4vh 0 3vh; }

        object-fit: contain;
        filter: drop-shadow(0 0 25px var(--blue-soft));

    .subtitle {
        color: var(--text-muted);
        font-size: 0.62rem;
        font-weight: 800;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        margin-top: 16px;
        text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }

    .login-form { width: 100%; }
    
    .input-label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text-muted);
        font-size: 0.6rem;
        font-weight: 800;
        letter-spacing: 2px;
        margin-bottom: 10px;
        text-transform: uppercase;
        text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    
    .input-label::before {
        content: "";
        width: 6px;
        height: 6px;
        background: var(--blue);
        border-radius: 1px;
        box-shadow: 0 0 10px var(--blue);
    }

    .input-group {
        display: flex;
        align-items: center;
        background: rgba(255, 255, 255, 0.01);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        margin-bottom: 14px;
        transition: all 0.2s;
        backdrop-filter: blur(1px);
        -webkit-backdrop-filter: blur(1px);
    }
    .input-group:focus-within {
        border-color: var(--blue);
        box-shadow: 0 0 15px var(--blue-soft);
    }

    .input-group input {

        background: transparent;
        border: none;
        outline: none;
        color: var(--text-main);
        padding: 15px 14px;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        min-width: 0;
        font-family: monospace;
    }
    .input-group input::placeholder { color: rgba(255, 255, 255, 0.3); font-weight: 600; }

    .btn-unlock {

        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 12px;
        padding: 17px;
        font-size: 0.95rem;
        font-weight: 900;
        letter-spacing: 2.5px;
        cursor: pointer;
        transition: transform 0.1s, box-shadow 0.2s;
        margin-bottom: 20px;
        box-shadow: 0 0 20px var(--blue-soft);
        display: flex; align-items: center; justify-content: center; gap: 10px;
        backdrop-filter: blur(1px);

    .btn-unlock:active { transform: scale(0.97); }

    .error-msg {

        font-size: 0.7rem;

        margin-bottom: 10px;

        box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    .menu-btn:hover, .sound-btn:hover { background: rgba(0, 229, 255, 0.2); border-color: var(--blue); }

    .dropdown-menu button {

    .pane { display: none; }

    .key-card {

        font-size: 0.8rem;

    .toggle-item {
        display: flex; align-items: center; justify-content: space-between;
        background: rgba(255, 255, 255, 0.01); border: 1px solid rgba(255, 255, 255, 0.15);

    .switch { position: relative; display: inline-block; width: 48px; height: 26px; flex-shrink: 0; }

    .slider {

        background-color: rgba(255,255,255,0.05); transition: 0.25s; border-radius: 26px;
        border: 1px solid rgba(255,255,255,0.2);
    }
    .slider:before {
        position: absolute; content: ""; height: 20px; width: 20px;
        left: 2px; bottom: 2px; background-color: #ffffff;
        transition: 0.25s; border-radius: 50%;
        box-shadow: 0 0 8px rgba(255,255,255,0.8);
    }
    input:checked + .slider { background-color: var(--blue); border-color: var(--blue); box-shadow: 0 0 15px var(--blue-soft); }
    input:checked + .slider:before { transform: translateX(22px); background-color: #000; }

    .quick-links {
        display: grid;

        gap: 10px;
        margin-bottom: 14px;
        margin-top: 15px;
    }
    .link-btn {

    .link-btn:active { background: var(--blue-soft); border-color: var(--blue); transform: scale(0.98); }
    .link-btn .link-icon {

    .connect-btn {

    }
    .connect-btn.unlocked:active { transform: scale(0.98); }

    .set-item {
        display: flex; align-items: center; gap: 13px; width: 100%; padding: 13px 15px;
        background: rgba(255, 255, 255, 0.01); border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 16px; margin-bottom: 10px; color: #fff; text-decoration: none;
        cursor: pointer; transition: all 0.2s; backdrop-filter: blur(1px);
    }
    .set-item:active { background: var(--blue-soft); border-color: var(--blue); }
    .set-icon {
        width: 40px; height: 40px; flex-shrink: 0; background: rgba(255,255,255,0.03);

    }
    .set-icon svg { width: 19px; height: 19px; }
    .set-body { flex: 1; text-align: left; }
    .set-title { font-size: 0.76rem; font-weight: 800; display: block; }
    .set-sub { font-size: 0.6rem; color: var(--text-muted); display: block; margin-top: 3px; }

    .nav-bar {
        display: flex; gap: 8px; margin-top: 14px; background: rgba(255, 255, 255, 0.01);
        padding: 6px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.15);

    .nav-btn {
        flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px;
        padding: 12px; background: transparent; border: none; border-radius: 10px;
        color: var(--text-muted); font-size: 0.62rem; font-weight: 900; cursor: pointer;
        letter-spacing: 1px;
    }
    .nav-btn svg { width: 17px; height: 17px; }
    .nav-btn.active {
        background: var(--blue-soft); color: #fff; border: 1px solid var(--blue);
        box-shadow: 0 0 12px var(--blue-soft);
    }

    .page-overlay {
        display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: rgba(0, 0, 0, 0.65); z-index: 1000; padding: 25px; flex-direction: column; overflow-y: auto;

    }
    .view-header {
        display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        padding-bottom: 15px; margin-bottom: 20px; max-width: 500px; margin-left: auto; margin-right: auto; width: 100%;
    }
    .back-btn {
        background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.2); color: #ffffff;
        padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: bold; backdrop-filter: blur(1px);
    }
</style>

        <label style="margin-top: 0; color: #ffffff; font-weight: 700; font-size: 13px; display: block; margin-bottom: 12px;">Choose a track:</label>
        <div id="songListContainer" style="display: flex; flex-direction: column; gap: 10px;"></div>
    </div>
</div>

<div id="videoSelectPage" class="page-overlay">
    <div class="view-header">
        <h2 style="margin: 0; color: #ffffff; font-size: 20px; text-align: left;">🎬 Select Background Video</h2>
        <button class="back-btn" onclick="goBackToHome('videoSelectPage')">← Back</button>
    </div>
    <div style="max-width: 500px; margin: 0 auto; width: 100%; background: rgba(255,255,255,0.01); padding: 25px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(1px);">
        <label style="margin-top: 0; color: #ffffff; font-weight: 700; font-size: 13px; display: block; margin-bottom: 12px;">Choose a video:</label>
        <div id="videoListContainer" style="display: flex; flex-direction: column; gap: 10px;"></div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://gamer-king-72dd9-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    const targetUrl     = 'http://m1nx.shop/subscription.json';
    const STORAGE_KEY   = 'DRIP_vip_access';
    const EXPIRY_KEY    = 'DRIP_vip_expiry';
    const ACTIVE_KEY    = 'DRIP_vip_key_val';
    const TOKEN_KEY     = 'DRIP_vip_auth_token';
    const V2RAY_PACKAGE = 'com.v2raytun.android';

    const loginView    = document.getElementById('loginView');
    const dashView     = document.getElementById('dashView');
    const keyInput     = document.getElementById('accessKey');
    const errorMsg     = document.getElementById('errorMsg');
    const displayKey   = document.getElementById('displayKey');
    const timerDisplay = document.getElementById('timerDisplay');
    const homePane     = document.getElementById('homePane');
    const settingsPane = document.getElementById('settingsPane');
    const navHome      = document.getElementById('navHome');
    const navSettings  = document.getElementById('navSettings');
    const copyStatus   = document.getElementById('copyStatus');
    const connectBtn   = document.getElementById('connectBtn');
    const aimbotToggle = document.getElementById('aimbotToggle');
    const fpsToggle    = document.getElementById('fpsToggle');

    let countdownInterval = null;
    let activeKeyRef = null;

    const playlist = [
        { name: "🎵 Gamer King Original (Default)", url: "https://github.com/abbasking20101-dot/GAMER_KING/raw/refs/heads/main/ReelAudio-24883.mp3" },
        { name: "🎵 Epic Gaming Beat 1", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
        { name: "🎵 High Energy Cyber Track", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
        { name: "🎵 Night Drive Lo-Fi", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
        { name: "🎵 Action Bass Booster", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" }
    ];

    const videoPlaylist = [
        { name: "🎬 Video 1 (Default)", url: "https://github.com/abbasking20101-dot/Testing-mode/raw/refs/heads/main/AQO3Y8JmUO-eLSMYZ2ro_dzNeTazgXZXxWDpdQiiJxju971KWF12i54sBCqbUIZQMkafrK6PF9VKrwfVtHY4QvHkJEYWnKwyXEOFKD0.mp4" },
        { name: "🎬 Video 2", url: "https://github.com/abbasking20101-dot/GAMER_KING/raw/refs/heads/main/Video-70965.mp4" },
        { name: "🎬 Video 3", url: "https://github.com/abbasking20101-dot/GAMER_KING/raw/refs/heads/main/Fonk%20song%20%F0%9F%8E%B5%20%F0%9F%91%BF%F0%9F%98%88%F0%9F%92%80%F0%9F%91%BF.mp4" },
        { name: "🎬 Video 4", url: "https://github.com/abbasking20101-dot/GAMER_KING/raw/refs/heads/main/%F0%9F%8E%A7%20--%20GETA%20ONLY%20--%20SLOWED%20--%20%23avee_player%20%20%23%20phonk%20%23funk%20%23sllicx%20ENGLISH%F0%9F%8E%B5%20Rate%20the%20song-%20-10%F0%9F%94%A5%20.mp4" },
        { name: "🎬 Video 5", url: "https://github.com/abbasking20101-dot/GAMER_KING/raw/refs/heads/main/M4%20on%207eleven%20Sen%20de%20bu%20tarz%20editler%20yapmak%20istiyorsan%20UmutcanFx%20ve%20Academy%E2%80%99e%20biomdan%20g%C3%B6z%20atabil.mp4" }
    ];

    window.onload = function() {
        renderSongList();
        renderVideoList();
        let bgVid = document.getElementById('bgVideo');
        if(bgVid) { bgVid.play().catch(e => { console.log("Autoplay prevented"); }); }
    };

    function renderSongList() {
        const container = document.getElementById('songListContainer');
        if(!container) return;
        container.innerHTML = "";
        playlist.forEach((song) => {
            let btn = document.createElement('button');
            btn.style.cssText = "width: 100%; padding: 12px 15px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600; text-align: left;";
            btn.innerText = song.name;
            btn.onclick = () => changeSong(song.url);
            container.appendChild(btn);
        });
    }

    function renderVideoList() {
        const container = document.getElementById('videoListContainer');
        if(!container) return;
        container.innerHTML = "";
        videoPlaylist.forEach((vid) => {
            let btn = document.createElement('button');
            btn.style.cssText = "width: 100%; padding: 12px 15px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600; text-align: left;";
            btn.innerText = vid.name;
            btn.onclick = () => changeVideo(vid.url);
            container.appendChild(btn);
        });
    }

    function changeSong(url) {
        let music = document.getElementById('bgMusic');
        let soundBtn = document.getElementById('soundBtn');
        music.src = url;
        music.play().then(() => {
            soundBtn.innerText = "🔊 Song: ON";
            soundBtn.style.background = "var(--blue-soft)";
            soundBtn.style.borderColor = "var(--blue)";
        }).catch(e => { alert("Song loaded! Click play/toggle sound to start."); });
        goBackToHome('songSelectPage');
    }

    function changeVideo(url) {
        let bgVid = document.getElementById('bgVideo');
        if(bgVid) {
            bgVid.src = url;
            bgVid.load();
            bgVid.play().catch(e => { console.log("Video play error"); });
        }
        goBackToHome('videoSelectPage');
    }

    function openSongSelector() {
        document.getElementById('dropdownMenu').style.display = 'none';
        document.getElementById('dashView').style.display = 'none';
        document.getElementById('songSelectPage').style.display = 'flex';
    }

    function openVideoSelector() {
        document.getElementById('dropdownMenu').style.display = 'none';
        document.getElementById('dashView').style.display = 'none';
        document.getElementById('videoSelectPage').style.display = 'flex';
    }

    function goBackToHome(pageId) {
        document.getElementById(pageId).style.display = 'none';
        document.getElementById('dashView').style.display = 'flex';
    }

    function toggleMusicSound() {
        let music = document.getElementById('bgMusic');
        let soundBtn = document.getElementById('soundBtn');
        if (music.paused) {
            music.play().then(() => {
                soundBtn.innerText = "🔊 Song: ON";
                soundBtn.style.background = "var(--blue-soft)";
                soundBtn.style.borderColor = "var(--blue)";
            }).catch(e => { alert("Please interact with the page first to enable audio!"); });
        } else {
            music.pause();
            soundBtn.innerText = "🔇 Song: OFF";
            soundBtn.style.background = "rgba(255, 255, 255, 0.025)";
            soundBtn.style.borderColor = "rgba(255, 255, 255, 0.2)";
        }
    }

    function toggleVideoSound() {
        let video = document.getElementById('bgVideo');
        let soundMenuBtn = document.getElementById('soundMenuBtn');
        if (video.muted) {
            video.muted = false;
            soundMenuBtn.innerText = "🔊 Video Sound: ON";
        } else {
            video.muted = true;
            soundMenuBtn.innerText = "🔇 Video Sound: OFF";
        }
        let dropdown = document.getElementById('dropdownMenu');
        if (dropdown) dropdown.style.display = 'none';
    }

    function toggleDropdown(event) {
        event.stopPropagation();
        let dropdown = document.getElementById('dropdownMenu');
        dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
    }

    window.onclick = function(event) {
        if (!event.target.matches('.menu-btn') && !event.target.closest('.dropdown-menu')) {
            let dropdown = document.getElementById('dropdownMenu');
            if (dropdown) dropdown.style.display = 'none';
        }
    }
    function getDeviceHWID() {
        let hwid = localStorage.getItem('DRIP_device_hwid');
        if (!hwid) {
            hwid = 'DEV-' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
            localStorage.setItem('DRIP_device_hwid', hwid);
        }
        return hwid;
    }

    function getPoolNodeFromKey(key) {
        if (key.startsWith('1M-') || key.includes('GAMER-KING')) return 'licenses_1min';
        if (key.startsWith('1H-')) return 'licenses_1hour';
        if (key.startsWith('1D-')) return 'licenses_1day';
        if (key.startsWith('7D-')) return 'licenses_7days';
        if (key.startsWith('30D-')) return 'licenses_30days';
        return null;
    }

    function generateRandomAuthToken() {
        return 'GK-TOKEN-' + Math.random().toString(36).substring(2, 8).toUpperCase() + '-' + Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    function verifyAndLogin() {
        const key = keyInput.value.trim().toUpperCase();
        if(!key){ showError('PLEASE ENTER YOUR ACCESS KEY'); return; }

        const unlockBtn = document.getElementById('unlockBtn');
        const spanText = unlockBtn.querySelector('span');
        spanText.textContent = 'VERIFYING...';

        db.ref(`licenses/${key}`).once('value').then(snapshot => {
            if (!snapshot.exists()) {
                spanText.textContent = 'UNLOCK';
                showError('ACCESS DENIED: INVALID OR DELETED KEY!');
                keyInput.value = '';
                return;
            }

            let keyData = snapshot.val();
            const poolNode = getPoolNodeFromKey(key) || 'licenses_1hour';
            const currentDevice = getDeviceHWID();

            if (keyData.lastDevice && keyData.lastDevice !== currentDevice && keyData.status === 'used') {
                spanText.textContent = 'UNLOCK';
                showError('ALREADY USED ON ANOTHER DEVICE!');
                keyInput.value = '';
                return;
            }

            let durationMs = 60 * 60 * 1000; 
            if (key.startsWith('1M-') || key.includes('GAMER-KING')) {
                durationMs = 1 * 60 * 1000; 
            } else if (keyData.duration && keyData.durationUnit) {
                if (keyData.durationUnit === 'minutes' || keyData.durationUnit === '1min') {
                    durationMs = keyData.duration * 60 * 1000;
                } else if (keyData.durationUnit === 'hours') {
                    durationMs = keyData.duration * 60 * 60 * 1000;
                } else if (keyData.durationUnit === 'days') {
                    durationMs = keyData.duration * 24 * 60 * 60 * 1000;
                }
            } else {
                if (key.startsWith('1M-')) durationMs = 1 * 60 * 1000;
                else if (key.startsWith('1H-')) durationMs = 1 * 60 * 60 * 1000;
                else if (key.startsWith('1D-')) durationMs = 1 * 24 * 60 * 60 * 1000;
                else if (key.startsWith('7D-')) durationMs = 7 * 24 * 60 * 60 * 1000;
                else if (key.startsWith('30D-')) durationMs = 30 * 24 * 60 * 60 * 1000;
            }

            const now = Date.now();
            let expiryTime = keyData.expiresAt;
            let authToken = keyData.authToken;

            if (!expiryTime || expiryTime === 0 || !authToken) {
                expiryTime = now + durationMs;
                authToken = generateRandomAuthToken();
                
                let updateObj = {
                    status: "used",
                    startedAt: now,
                    expiresAt: expiryTime,
                    authToken: authToken,
                    lastDevice: currentDevice
                };

                let updates = {};
                updates[`licenses/${key}`] = updateObj;
                updates[`${poolNode}/${key}`] = updateObj;
                db.ref().update(updates);
            }

            if (now >= expiryTime) {
                let updates = {};
                updates[`licenses/${key}`] = null;
                updates[`${poolNode}/${key}`] = null;
                db.ref().update(updates);

                spanText.textContent = 'UNLOCK';
                showError('ACCESS DENIED: KEY EXPIRED!');
                keyInput.value = '';
                return;
            }

            finalizeLogin(key, expiryTime, authToken);

        }).catch(err => {
            document.getElementById('unlockBtn').querySelector('span').textContent = 'UNLOCK';
            showError('DATABASE CONNECTION ERROR!');
            keyInput.value = '';
        });
    }

    function finalizeLogin(key, expiryTime, authToken) {
        errorMsg.classList.remove('show');
        document.getElementById('unlockBtn').querySelector('span').textContent = 'UNLOCK';
        
        localStorage.setItem(STORAGE_KEY, '1');
        localStorage.setItem(ACTIVE_KEY, key);
        localStorage.setItem(EXPIRY_KEY, expiryTime);
        localStorage.setItem(TOKEN_KEY, authToken);

        openDashboard(key, expiryTime);
    }

    function showError(msg){
        errorMsg.textContent = msg;
        errorMsg.classList.add('show');
    }

    keyInput.addEventListener('input', () => errorMsg.classList.remove('show'));
    function openDashboard(key, expiryTime){
        displayKey.textContent = key;
        showTab('home');
        loginView.classList.remove('active');
        dashView.classList.add('active');

        startTimer(expiryTime, key);
        listenKeyDeletion(key);
        checkToggles();
    }

    function listenKeyDeletion(key) {
        if (activeKeyRef) activeKeyRef.off();
        activeKeyRef = db.ref(`licenses/${key}`);

        activeKeyRef.on('value', snapshot => {
            if (!snapshot.exists()) {
                alert('ACCESS DENIED: Key deleted or expired!');
                logout();
            }
        });
    }

    function startTimer(expiryTime, key) {
        if (countdownInterval) clearInterval(countdownInterval);

        countdownInterval = setInterval(() => {
            const now = new Date().getTime();
            const distance = expiryTime - now;

            if (distance <= 0) {
                clearInterval(countdownInterval);
                const poolNode = getPoolNodeFromKey(key) || 'licenses_1hour';
                if (key) {
                    let updates = {};
                    updates[`licenses/${key}`] = null;
                    updates[`${poolNode}/${key}`] = null;
                    db.ref().update(updates);
                }
                alert('ACCESS DENIED: Time is up!');
                logout();
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            if(timerDisplay) {
                if (days > 0) {
                    timerDisplay.textContent = `Time Left: ${days}d ${hours}h ${minutes}m ${seconds}s`;
                } else {
                    timerDisplay.textContent = `Time Left: ${hours}h ${minutes}m ${seconds}s`;
                }
            }
        }, 1000);
    }

    function logout(){
        if (countdownInterval) clearInterval(countdownInterval);
        if (activeKeyRef) {
            let savedKey = localStorage.getItem(ACTIVE_KEY);
            if(savedKey) db.ref(`licenses/${savedKey}`).off();
        }
        try {
            localStorage.removeItem(STORAGE_KEY);
            localStorage.removeItem(EXPIRY_KEY);
            localStorage.removeItem(ACTIVE_KEY);
            localStorage.removeItem(TOKEN_KEY);
        } catch(e){}
        
        keyInput.value = '';
        dashView.classList.remove('active');
        loginView.classList.add('active');
    }

    function showTab(tab){
        const isHome = tab === 'home';
        homePane.classList.toggle('active', isHome);
        settingsPane.classList.toggle('active', !isHome);
        navHome.classList.toggle('active', isHome);
        navSettings.classList.toggle('active', !isHome);
        document.querySelector('.scroll-content').scrollTop = 0;
    }

    function checkToggles(){
        const allOn = aimbotToggle.checked && fpsToggle.checked;
        if (allOn){
            connectBtn.disabled = false;
            connectBtn.classList.add('unlocked');
        } else {
            connectBtn.disabled = true;
            connectBtn.classList.remove('unlocked');
        }
    }

    function addSubscription(btn){
        const original = btn.querySelector('span').textContent;
        btn.querySelector('span').textContent = 'CONNECTING...';
        btn.disabled = true;

        const currentAuthToken = localStorage.getItem(TOKEN_KEY) || 'GK-DEFAULT-TOKEN';
        const dynamicTargetUrl = targetUrl + '?token=' + encodeURIComponent(currentAuthToken);
        
        /* v2RayTun Encoded Sub Import Fix */
        const intentLink = 'intent://import/' + encodeURIComponent(dynamicTargetUrl) + '#Intent;scheme=v2raytun;package=' + V2RAY_PACKAGE + ';end;';

        window.location.href = intentLink;

        setTimeout(() => {
            btn.querySelector('span').textContent = original;
            checkToggles();
        }, 2000);
    }

    function copyKey(){
        const key = displayKey.textContent.trim();
        if(key && key !== '—') {
            navigator.clipboard.writeText(key).then(() => {
                copyStatus.textContent = '✔ Copied to clipboard';
                copyStatus.style.color = 'var(--success)';
                setTimeout(() => {
                    copyStatus.textContent = 'Tap to copy';
                    copyStatus.style.color = '';
                }, 2000);
            });
        }
    }

    (function autoLogin(){
        try {
            const isLogged = localStorage.getItem(STORAGE_KEY);
            const expiryTime = localStorage.getItem(EXPIRY_KEY);
            const savedKey = localStorage.getItem(ACTIVE_KEY);

            if (isLogged === '1' && expiryTime && savedKey) {
                const now = new Date().getTime();
                if (now < parseInt(expiryTime)) {
                    openDashboard(savedKey, parseInt(expiryTime));
                } else {
                    const poolNode = getPoolNodeFromKey(savedKey) || 'licenses_1hour';
                    let updates = {};
                    updates[`licenses/${savedKey}`] = null;
                    updates[`${poolNode}/${savedKey}`] = null;
                    db.ref().update(updates);
                    logout();
                }
            }
        } catch(e){}
    })();
</script>
</body>
</html>
